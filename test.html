<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>VoxelCraft HTML5 — Suite de Tests Automatizados</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --border: #1f2937;
      --pass: #4ade80;
      --fail: #f87171;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, monospace;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 480px;
      gap: 20px;
      height: 100vh;
    }
    .results-pane {
      overflow-y: auto;
      padding-right: 8px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #summary-banner {
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 700;
      margin-bottom: 16px;
      background: var(--card);
      border: 1px solid var(--border);
    }
    #summary-banner.pass { border-color: var(--pass); color: var(--pass); }
    #summary-banner.fail { border-color: var(--fail); color: var(--fail); }
    .suite-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 12px;
    }
    .suite-title {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
      color: #e2e8f0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }
    .test-row {
      font-size: 12.5px;
      padding: 4px 0;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .test-row.pass .status { color: var(--pass); font-weight: 700; }
    .test-row.fail .status { color: var(--fail); font-weight: 700; }
    .bench-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 6px;
    }
    .bench-table th, .bench-table td {
      text-align: left;
      padding: 5px 8px;
      border-bottom: 1px solid var(--border);
    }
    .bench-table th {
      color: var(--muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
    }
    .bench-table td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-family: monospace;
    }
    .bench-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(74, 222, 128, 0.14);
      color: var(--pass);
      font-weight: 700;
    }
    .iframe-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
    }
    iframe {
      width: 100%;
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #000;
    }
  </style>
</head>
<body>
  <div class="results-pane">
    <h1>
      <span>VoxelCraft — Test Runner</span>
      <button id="btn-rerun" style="padding:6px 12px;border-radius:6px;border:none;background:#4ade80;color:#052e16;font-weight:700;cursor:pointer;">Re-ejecutar Tests</button>
    </h1>
    <div id="summary-banner">Cargando motor e iniciando batería de pruebas...</div>
    <div id="benchmark-container"></div>
    <div id="suites-container"></div>
  </div>

  <div class="iframe-wrap">
    <div style="font-size:12px;color:var(--muted);">Instancia en vivo bajo prueba (<code>index.html</code>):</div>
    <iframe id="game-frame" src="./index.html?v=50"></iframe>
  </div>

  <script>
    const suitesContainer = document.getElementById('suites-container');
    const summaryBanner = document.getElementById('summary-banner');
    const gameFrame = document.getElementById('game-frame');

    function assert(condition, message) {
      if (!condition) throw new Error(message || 'Assertion failed');
    }

    function assertApprox(actual, expected, tol, message) {
      if (Math.abs(actual - expected) > tol) {
        throw new Error(`${message || 'assertApprox'}: esperado ~${expected}, recibido ${actual}`);
      }
    }

    async function runAllTests() {
      suitesContainer.innerHTML = '';
      summaryBanner.className = '';
      summaryBanner.textContent = 'Ejecutando pruebas...';

      const win = gameFrame.contentWindow;
      const doc = gameFrame.contentDocument;
      const vc = win.__VOXELCRAFT__;

      if (!vc) {
        summaryBanner.className = 'fail';
        summaryBanner.textContent = 'ERROR: window.__VOXELCRAFT__ no encontrado en index.html';
        return;
      }

      const suites = [];
      let totalPassed = 0;
      let totalFailed = 0;
      const failures = [];

      function describe(suiteName, fn) {
        suites.push({ suiteName, fn, tests: [] });
      }

      let currentSuite = null;
      function it(testName, testFn) {
        currentSuite.tests.push({ testName, testFn });
      }

      // =========================================================================
      // SUITE 1: Motor WebGL, Atlas Procedural y Texturas de Grietas
      // =========================================================================
      describe('1. Motor WebGL, Atlas Procedural y Grietas', () => {
        it('Inicializa escena Three.js, cámara y renderer WebGL', () => {
          assert(vc.scene && vc.camera && vc.renderer, 'Faltan objetos principales de Three.js');
          assert(vc.atlasCanvas.width === vc.ATLAS_COLS * 16, 'Ancho del atlas incorrecto');
          assert(vc.atlasCanvas.height === 16, 'Alto del atlas incorrecto');
        });

        it('Genera los 34 tiles de texturas pixel-art sin huecos vacíos en bloques opacos', () => {
          const ctx = vc.atlasCanvas.getContext('2d');
          // Comprobar Césped (0), Piedra (3), Diamante (20), TNT (26,27), Lava (28), Obsidiana (29) y Lámpara Redstone (32,33)
          for (const tileIdx of [0, 3, 20, 26, 27, 28, 29, 32, 33]) {
            const img = ctx.getImageData(tileIdx * 16 + 8, 8, 1, 1).data;
            assert(img[3] === 255, `Tile ${tileIdx} debería ser opaco (alpha=255), obtuvo ${img[3]}`);
          }
        });

        it('Genera las 8 fases de grietas para rotura progresiva', () => {
          assert(Array.isArray(vc.crackTextures) && vc.crackTextures.length === 8, 'Debe haber 8 texturas de grietas');
        });
      });

      // =========================================================================
      // SUITE 2: Generación de Mundo, Biomas, Cuevas 3D y Minerales
      // =========================================================================
      describe('2. Generación de Mundo, Biomas, Cuevas 3D y Minerales', () => {
        it('Genera chunks de 16x64x16 en memoria tipada Uint8Array (16,384 bytes)', () => {
          const ch = vc.getChunkData(0, 0);
          assert(ch && ch.data instanceof win.Uint8Array, 'El chunk debe usar Uint8Array');
          assert(ch.data.byteLength === 16384, 'El tamaño del chunk debe ser exactamente 16,384 bytes');
        });

        it('Coloca Roca Madre (Bedrock) en toda la capa Y=0', () => {
          for (let x = 0; x < 16; x += 5) {
            for (let z = 0; z < 16; z += 5) {
              assert(vc.getVoxelGlobal(x, 0, z) === vc.BLOCK.BEDROCK, `Falta Bedrock en (${x},0,${z})`);
            }
          }
        });

        it('Excava cuevas 3D subterráneas y distribuye minerales por profundidad', () => {
          let airUnderground = 0;
          let oresFound = 0;
          for (let cx = 0; cx <= 1; cx++) {
            for (let cz = 0; cz <= 1; cz++) {
              const ch = vc.getChunkData(cx, cz);
              for (let lx = 0; lx < 16; lx++) {
                for (let lz = 0; lz < 16; lz++) {
                  for (let y = 3; y < 18; y++) {
                    const b = ch.data[(lz * 16 + lx) * 64 + y];
                    if (b === vc.BLOCK.AIR) airUnderground++;
                    if (b >= vc.BLOCK.COAL_ORE && b <= vc.BLOCK.DIAMOND_ORE) oresFound++;
                  }
                }
              }
            }
          }
          assert(airUnderground > 20, `Se esperaban cuevas 3D subterráneas (aire=${airUnderground})`);
          assert(oresFound > 10, `Se esperaban menas de minerales subterráneos (menas=${oresFound})`);
        });
      });

      // =========================================================================
      // SUITE 3: Hidden Face Culling, Oclusión Ambiental (AO) y Cross-Mesh
      // =========================================================================
      describe('3. Hidden Face Culling, AO y Geometría Cross-Mesh', () => {
        it('Construye BufferGeometry con menos del 10% de las caras totales del chunk', () => {
          vc.rebuildChunkImmediate(0, 0);
          const ch = vc.getChunkData(0, 0);
          assert(ch.solidMesh && ch.solidMesh.geometry, 'El chunk (0,0) debe tener solidMesh');
          const triCount = ch.solidMesh.geometry.index.count / 3;
          const unculledMaxTris = 16384 * 12; // 196,608 triángulos sin culling
          assert(triCount > 100 && triCount < unculledMaxTris * 0.1, `Culling ineficiente: ${triCount} triángulos`);
        });

        it('Genera geometría cruzada (X-Mesh, 16 vértices) al colocar una Antorcha o Flor', () => {
          const tx = 6, ty = 50, tz = 6;
          vc.setVoxelGlobal(tx, ty, tz, vc.BLOCK.TORCH);
          assert(vc.getVoxelGlobal(tx, ty, tz) === vc.BLOCK.TORCH, 'No se colocó la antorcha');
          assert(vc.BLOCK_DEFS[vc.BLOCK.TORCH].shape === 'cross', 'La antorcha debe ser shape=cross');
          vc.setVoxelGlobal(tx, ty, tz, vc.BLOCK.AIR);
        });
      });

      // =========================================================================
      // SUITE 4: Iluminación Vóxel BFS (Sol + Propagación de Antorchas)
      // =========================================================================
      describe('4. Iluminación Vóxel BFS (Luz Solar y Antorchas)', () => {
        it('Asigna luz solar máxima (15) en el cielo abierto', () => {
          const l = vc.getLightGlobal(8, 62, 8);
          assert((l >> 4) === 15, `Luz solar en Y=62 debería ser 15, obtuvo ${l >> 4}`);
        });

        it('Propaga luz artificial cálida (15 -> 14 -> 13) al colocar una Antorcha', () => {
          const tx = 8, ty = 52, tz = 8;
          vc.setVoxelGlobal(tx, ty, tz, vc.BLOCK.AIR);
          vc.setVoxelGlobal(tx + 1, ty, tz, vc.BLOCK.AIR);
          vc.setVoxelGlobal(tx + 2, ty, tz, vc.BLOCK.AIR);

          vc.setVoxelGlobal(tx, ty, tz, vc.BLOCK.TORCH);
          const l0 = vc.getLightGlobal(tx, ty, tz) & 15;
          const l1 = vc.getLightGlobal(tx + 1, ty, tz) & 15;
          const l2 = vc.getLightGlobal(tx + 2, ty, tz) & 15;

          assert(l0 === 15, `Luz en la antorcha debe ser 15, obtuvo ${l0}`);
          assert(l1 === 14, `Luz a 1 bloque debe ser 14, obtuvo ${l1}`);
          assert(l2 === 13, `Luz a 2 bloques debe ser 13, obtuvo ${l2}`);

          // Al quitar la antorcha, la luz artificial debe volver a 0
          vc.setVoxelGlobal(tx, ty, tz, vc.BLOCK.AIR);
          const lAfter = vc.getLightGlobal(tx, ty, tz) & 15;
          assert(lAfter === 0, `Luz tras quitar antorcha debe ser 0, obtuvo ${lAfter}`);
        });
      });

      // =========================================================================
      // SUITE 5: DDA Raycaster, Rotura Progresiva y Persistencia Delta
      // =========================================================================
      describe('5. DDA Raycaster, Rotura Progresiva y Persistencia', () => {
        it('Detecta bloques con precisión exacta y normal de cara mediante 3D DDA', () => {
          vc.setVoxelGlobal(10, 50, 10, vc.BLOCK.STONE);
          vc.setVoxelGlobal(10, 51, 10, vc.BLOCK.AIR);
          vc.setVoxelGlobal(10, 52, 10, vc.BLOCK.AIR);

          const hit = vc.raycastVoxel(10.5, 52.5, 10.5, 0, -1, 0, 5.0);
          assert(hit !== null, 'DDA Raycast no detectó el bloque de piedra');
          assert(hit.x === 10 && hit.y === 50 && hit.z === 10, `Coordenadas erróneas: ${JSON.stringify(hit)}`);
          assert(hit.ny === 1, `Normal superior debería ser ny=1, obtuvo ${hit.ny}`);
          vc.setVoxelGlobal(10, 50, 10, vc.BLOCK.AIR);
        });

        it('Pica progresivamente un bloque y acelera x3.5 con el Pico de Diamante', () => {
          vc.setVoxelGlobal(11, 50, 10, vc.BLOCK.STONE);
          const hit = { x: 11, y: 50, z: 10, nx: 0, ny: 1, nz: 0, block: vc.BLOCK.STONE };
          vc.setTouchPlaying(true);
          // 1. Verificar que una partida nueva empieza sin objetos (todo a 0) y que las ranuras vacías NO muestran un icono de item
          const initCounts = vc.createInitialInventoryCounts();
          assert(
            Object.values(initCounts).every(v => v === 0),
            'Cada nueva partida debe empezar con 0 objetos en createInitialInventoryCounts()'
          );
          vc.hotbarSlots[0] = vc.BLOCK.AIR;
          vc.updateHotbarSelection(0);
          const slot0Canvas = doc.querySelector('#hotbar .slot canvas');
          const slot0Alpha = slot0Canvas.getContext('2d').getImageData(8, 8, 1, 1).data[3];
          assert(slot0Alpha === 0, `Una ranura vacía de la hotbar no debe dibujar ningún icono de item (alpha=${slot0Alpha})`);
          const hasManoItemInInv = Array.from(doc.querySelectorAll('#inv-grid .inv-item span')).some(s => s.textContent === 'Mano');
          assert(!hasManoItemInInv, '"Mano" no debe existir como un item dentro de la mochila (#inv-grid)');
          assert(
            doc.getElementById('block-label').textContent === 'Mano',
            `Sin item seleccionado debe mostrarse "Mano" (no "1. Mano"), obtuvo "${doc.getElementById('block-label').textContent}"`
          );

          // 2. Picar Piedra con la Mano debe ser lento (speedMult=0.35 -> < 10% en 0.15s)
          vc.setMiningHeld(true);
          vc.updateMining(0.15, hit);
          const pHand = vc.getState().mineProgress;
          assert(pHand > 0.02 && pHand < 0.12, `La Mano debe picar piedra lentamente (pHand=${pHand.toFixed(3)})`);
          vc.setMiningHeld(false);
          vc.updateMining(0.01, null);

          // 3. Equipar Pico de Diamante en ranura 0, verificar que al deseleccionar la ranura activa se lleva la Mano, y al seleccionarla pica x3.5
          vc.inventoryCounts[vc.BLOCK.TOOL_PICKAXE] = 1;
          vc.hotbarSlots[0] = vc.BLOCK.TOOL_PICKAXE;
          vc.updateHotbarSelection(0);
          win.dispatchEvent(new win.KeyboardEvent('keydown', { code: 'Digit1', bubbles: true }));
          assert(
            vc.getState().selectedSlot === -1 && vc.getActiveHeldItem() === vc.BLOCK.AIR && doc.getElementById('block-label').textContent === 'Mano',
            'Pulsar la tecla de la ranura ya seleccionada debe deseleccionar el item y pasar a llevar la Mano'
          );
          vc.updateHotbarSelection(0); // Volver a seleccionar Ranura 0: Pico de Diamante
          vc.setMiningHeld(true);

          vc.updateMining(0.15, hit);
          const p1 = vc.getState().mineProgress;
          assert(p1 > 0.35 && p1 < 0.9, `Progreso de minado con pico inesperado: ${p1}`);

          vc.updateMining(0.25, hit);
          assert(vc.getVoxelGlobal(11, 50, 10) === vc.BLOCK.AIR, 'El bloque debería haberse roto al superar 100%');
          vc.setMiningHeld(false);
        });

        it('Guarda automáticamente los cambios delta en localStorage', () => {
          const saved = win.localStorage.getItem('voxelcraft_opt_save_v2');
          assert(saved && saved.includes('deltas'), 'No se guardaron los deltas en localStorage');
        });
      });

      // =========================================================================
      // SUITE 6: Físicas de Jugador, Colisiones AABB, Vuelo y Daño por Caída
      // =========================================================================
      describe('6. Físicas de Jugador, Colisiones AABB y Supervivencia', () => {
        it('Detecta colisiones AABB contra bloques sólidos y permite atravesar flores/aire', () => {
          vc.setVoxelGlobal(12, 50, 12, vc.BLOCK.STONE);
          assert(vc.checkAABBCollision(12.5, 50.0, 12.5) === true, 'Debería colisionar con Piedra');

          vc.setVoxelGlobal(12, 50, 12, vc.BLOCK.FLOWER_RED);
          assert(vc.checkAABBCollision(12.5, 50.0, 12.5) === false, 'No debería colisionar con una flor');
          vc.setVoxelGlobal(12, 50, 12, vc.BLOCK.AIR);
        });

        it('Alterna el modo Vuelo (F) y actualiza corazones al recibir daño', () => {
          const initialFly = vc.player.flying;
          vc.toggleFlyingMode();
          assert(vc.player.flying === !initialFly, 'No cambió el estado de vuelo');
          if (vc.player.flying) vc.toggleFlyingMode(); // dejar en modo caminar

          const prevHp = vc.player.health;
          vc.damagePlayer(2);
          assert(vc.player.health === prevHp - 2, 'No se restaron 2 corazones de vida');
          const emptyHearts = doc.querySelectorAll('#hearts-row .heart.empty').length;
          assert(emptyHearts === 2, 'La interfaz de corazones no reflejó el daño');
          vc.player.health = vc.player.maxHealth;
        });
      });

      // =========================================================================
      // SUITE 7: Físicas Vóxel por Tick Queue (Arena con Gravedad, Agua y TNT)
      // =========================================================================
      describe('7. Tick Queue (Arena con Gravedad, Agua) y Explosión de TNT', () => {
        it('Hace caer bloques de Arena suspendidos en el aire mediante simQueue', () => {
          vc.setVoxelGlobal(14, 52, 14, vc.BLOCK.AIR);
          vc.setVoxelGlobal(14, 53, 14, vc.BLOCK.SAND);
          assert(vc.getVoxelGlobal(14, 53, 14) === vc.BLOCK.SAND, 'Arena no colocada en Y=53');

          vc.updateVoxelSimulation(0.20);
          assert(vc.getVoxelGlobal(14, 53, 14) === vc.BLOCK.AIR, 'La arena debería haber dejado Y=53');
          assert(vc.getVoxelGlobal(14, 52, 14) === vc.BLOCK.SAND, 'La arena debería haber caído a Y=52');
          vc.setVoxelGlobal(14, 52, 14, vc.BLOCK.AIR);
        });

        it('Activa TNT al golpearlo y excava un cráter esférico al detonar sin romper Bedrock', () => {
          vc.setVoxelGlobal(20, 48, 20, vc.BLOCK.STONE);
          vc.setVoxelGlobal(20, 49, 20, vc.BLOCK.TNT);

          vc.igniteTNT(20, 49, 20, 0.1);
          assert(vc.activeTNTs.length >= 1, 'Debería haberse creado la entidad TNT activa');
          assert(vc.getVoxelGlobal(20, 49, 20) === vc.BLOCK.AIR, 'El vóxel estático de TNT debe pasar a aire');

          // Avanzar simulación para que detone
          vc.updateVoxelSimulation(0.15);
          assert(vc.getVoxelGlobal(20, 48, 20) === vc.BLOCK.AIR, 'La explosión debería haber destruido la piedra en Y=48');
          assert(vc.getVoxelGlobal(20, 0, 20) === vc.BLOCK.BEDROCK, 'La explosión nunca debe romper Bedrock');
        });
      });

      // =========================================================================
      // SUITE 8: Motor de Criaturas / Mobs (Ovejas, Cerdos, Zombies y Combate)
      // =========================================================================
      describe('8. Motor de Criaturas (Ovejas, Cerdos, Zombies y Combate)', () => {
        it('Genera Ovejas, Cerdos y Zombies, los detecta por Raycast y aplica daño/knockback', () => {
          while (vc.mobs.length > 0) vc.removeMobAt(0);
          vc.spawnMob('sheep', 15.5, 45, 15.5);
          vc.spawnMob('zombie', 18.5, 45, 15.5);
          assert(vc.mobs.length === 2, 'Debería haber 2 mobs activos');

          const hitM = vc.raycastMob(15.5, 45.6, 13.0, 0, 0, 1, 4.5);
          assert(hitM && hitM.type === 'sheep', 'raycastMob debería haber detectado a la oveja');
          assert(vc.mobAtlasCanvas && vc.mobAtlasCanvas.width >= 128 && vc.mobAtlasTexture, 'Debe existir el mini-atlas pixel-art procedural para Mobs');
          assert(hitM.head.material.map === vc.mobAtlasTexture && hitM.head.material.vertexColors === true, 'Los Mobs deben usar el atlas pixel-art compartido y sombreado direccional por vértice');
          assert(vc.mobGeos.headPig.attributes.position.count === 48 && vc.mobGeos.headGolem.attributes.position.count === 48, 'Las cabezas del Cerdo y Gólem deben fusionar hocico/nariz 3D en un solo BufferGeometry (0 draw calls extra)');
          const pigUv = vc.mobGeos.headPig.attributes.uv.array;
          const golemUv = vc.mobGeos.headGolem.attributes.uv.array;
          const pigLegUv = vc.mobGeos.legPig.attributes.uv.array;
          assert(Math.abs(pigUv[16 * 2] - pigUv[40 * 2]) > 0.01, 'El hocico 3D del cerdo no debe reutilizar el tile de la cara completa con ojos');
          assert(Math.abs(pigUv[24 * 2] - pigUv[40 * 2]) > 0.01, 'Los laterales/parte superior del hocico 3D del cerdo deben usar piel limpia sin fosas nasales');
          assert(Math.abs(pigUv[0] - pigLegUv[0]) > 0.01, 'La cabeza y cuerpo del cerdo no deben reutilizar el tile con pezuñas de las patas');
          assert(Math.abs(golemUv[16 * 2] - golemUv[40 * 2]) > 0.01, 'La nariz 3D del Gólem no debe reutilizar el tile de la cara completa con ojos');

          const hpBefore = hitM.hp;
          vc.damageMob(hitM, 2, 0, 1);
          assert(hitM.hp === hpBefore - 2, 'La oveja debería haber perdido 2 HP');
          assert(hitM.vz > 0, 'La oveja debería haber recibido knockback en +Z');

          // Derrotar a la oveja
          vc.damageMob(hitM, 10, 0, 1);
          assert(vc.mobs.length === 1, 'La oveja derrotada debería haberse eliminado');
          while (vc.mobs.length > 0) vc.removeMobAt(0);
        });
      });

      // =========================================================================
      // SUITE 9: Cielo Dinámico, Ciclo Día/Noche e Interfaz Híbrida PC + Móvil
      // =========================================================================
      describe('9. Cielo Dinámico, Día/Noche e Interfaz Híbrida (PC + Móvil)', () => {
        it('Actualiza Sol, Luna, Estrellas, Nubes 3D y alterna Día/Noche (T)', () => {
          assert(vc.sunMesh && vc.moonMesh && vc.sunGlow && vc.moonGlow && vc.cloudMesh, 'Faltan mallas o halos celestes');
          assert(vc.sunMesh.geometry.type === 'SphereGeometry' && vc.moonMesh.geometry.type === 'SphereGeometry', 'El Sol y la Luna deben ser redondos (SphereGeometry)');
          assert(vc.sunGlow.isSprite && vc.moonGlow.isSprite && vc.sunMesh.geometry.attributes.color && vc.moonMesh.geometry.attributes.color, 'El Sol y la Luna deben tener corona/halo brillante y sombreado esférico 3D');
          assert(vc.sunMesh.material.depthWrite === false && vc.sunGlow.renderOrder > vc.sunMesh.renderOrder, 'El halo del Sol debe renderizarse sobre el Sol sin quedar ocluido detrás en el depth buffer');
          const angle0 = vc.getCelestialAngle(), moon0 = vc.getMoonAngle();
          vc.updateDynamicSky(10.0);
          const dSun = (vc.getCelestialAngle() - angle0 + Math.PI * 2) % (Math.PI * 2);
          const dMoon = (vc.getMoonAngle() - moon0 + Math.PI * 2) % (Math.PI * 2);
          assert(dSun > 0.03 && dSun < 0.10, 'El ciclo día/noche debe avanzar de forma pausada (~20 min por ciclo)');
          assert(Math.abs(dSun - dMoon) > 0.001, 'El Sol y la Luna deben tener velocidades orbitales independientes');
          vc.setTimeOfDay(0);
          const noonSun = vc.sunMesh.material.color.clone(), noonSky = vc.scene.background.clone();

      describe('14. Web Worker Multihilo (Blob + Transferable) y Escalado Dinámico', () => {
        it('Ejecuta el meshing de chunks en Web Worker con Transferable ArrayBuffers (Zero-Copy) e idéntica geometría', async () => {
          const wState0 = vc.getWorkerState();
          assert(wState0.hasWorker === true, 'meshWorker (Blob URL) debería estar inicializado y activo');

          // Compare synchronous mesh arrays vs Worker mesh arrays on chunk (0, 0)
          const syncMesh = vc.buildChunkMeshArrays(0, 0, vc.getVoxelGlobal, vc.getLightGlobal, vc.getState().sunFactor);
          const completedBefore = vc.getWorkerState().workerJobsCompleted;
          const workerMesh = await vc.requestChunkMeshWorker(0, 0);

          assert(workerMesh !== null && workerMesh.solid && workerMesh.water, 'requestChunkMeshWorker(0,0) debe resolver con buffers solid y water');
          assert(
            vc.getWorkerState().workerJobsCompleted >= completedBefore + 1,
            'workerJobsCompleted debe incrementarse al completar el trabajo en el Web Worker'
          );
          assert(
            workerMesh.solid.idx.length === syncMesh.solid.idx.length,
            `El Worker debe generar exactamente el mismo nº de índices sólidos (${workerMesh.solid.idx.length} vs ${syncMesh.solid.idx.length})`
          );
          assert(
            workerMesh.solid.pos.byteLength === syncMesh.solid.pos.byteLength,
            'El buffer Float32Array de posiciones transferido por el Worker debe coincidir al byte'
          );
          assert(
            vc.getWorkerState().lastWorkerMainThreadMs < 3.0,
            `El coste en el hilo principal del Worker (pack + apply) debe ser < 3.0 ms (fue ${vc.getWorkerState().lastWorkerMainThreadMs.toFixed(2)} ms)`
          );
        });

        it('Genera y aplica solidMesh en todos los chunks del radio de render sin dejar agujeros (Bug Regresión ch.meshVersion)', async () => {
          // 1. Test a brand-new chunk never touched by rebuildChunkImmediate
          const freshCx = 12, freshCz = 12;
          vc.chunks.delete(`${freshCx},${freshCz}`);
          const freshCh = vc.getChunkData(freshCx, freshCz);
          assert(freshCh.solidMesh === null && freshCh.dirty === true, 'El chunk recién creado debe empezar sin malla y dirty=true');

          await vc.requestChunkMeshWorker(freshCx, freshCz);
          assert(
            freshCh.solidMesh !== null && freshCh.dirty === false && freshCh.queued === false,
            `Un chunk nuevo procesado por el Web Worker debe recibir su solidMesh en la escena (solidMesh=${!!freshCh.solidMesh}, dirty=${freshCh.dirty})`
          );

          // 2. Pump streaming & wait for any in-flight Worker jobs, then verify zero missing chunk meshes around player
          for (let step = 0; step < 80; step++) {
            vc.updateChunkStreaming();
            if (vc.buildQueue.length === 0 && vc.getWorkerState().workerJobsInFlight === 0) break;
            await new Promise(r => setTimeout(r, 15));
          }
          // Wait for any remaining worker jobs in flight
          for (let w = 0; w < 40 && vc.getWorkerState().workerJobsInFlight > 0; w++) {
            await new Promise(r => setTimeout(r, 15));
          }

          const pcx = Math.floor(vc.player.x / vc.CHUNK_SIZE);
          const pcz = Math.floor(vc.player.z / vc.CHUNK_SIZE);
          const rDist = vc.getState().renderDistance;
          let missingChunks = 0;
          let checkedChunks = 0;
          for (let dz = -rDist; dz <= rDist; dz++) {
            for (let dx = -rDist; dx <= rDist; dx++) {
              if (dx * dx + dz * dz > (rDist + 0.5) * (rDist + 0.5)) continue;
              checkedChunks++;
              const ch = vc.chunks.get(`${pcx + dx},${pcz + dz}`);
              if (!ch || !ch.solidMesh || ch.dirty) {
                missingChunks++;
              }
            }
          }
          assert(
            missingChunks === 0 && checkedChunks >= 49,
            `Todos los ${checkedChunks} chunks dentro de renderDistance=${rDist} deben tener su malla 3D activa sin agujeros (faltan ${missingChunks} chunks)`
          );

          // 3. Simulate flying to (29, 24, 22) as in the reported screenshot and verify 0 missing chunk meshes there too
          const savedX = vc.player.x, savedY = vc.player.y, savedZ = vc.player.z;
          vc.player.x = 29; vc.player.y = 24; vc.player.z = 22;
          for (let step = 0; step < 80; step++) {
            vc.updateChunkStreaming();
            if (vc.buildQueue.length === 0 && vc.getWorkerState().workerJobsInFlight === 0) break;
            await new Promise(r => setTimeout(r, 15));
          }
          for (let w = 0; w < 40 && vc.getWorkerState().workerJobsInFlight > 0; w++) {
            await new Promise(r => setTimeout(r, 15));
          }
          const pcx2 = Math.floor(vc.player.x / vc.CHUNK_SIZE);
          const pcz2 = Math.floor(vc.player.z / vc.CHUNK_SIZE);
          let missingAfterMove = 0;
          for (let dz = -rDist; dz <= rDist; dz++) {
            for (let dx = -rDist; dx <= rDist; dx++) {
              if (dx * dx + dz * dz > (rDist + 0.5) * (rDist + 0.5)) continue;
              const ch = vc.chunks.get(`${pcx2 + dx},${pcz2 + dz}`);
              if (!ch || !ch.solidMesh || ch.dirty) missingAfterMove++;
            }
          }
          assert(
            missingAfterMove === 0,
            `Al desplazarse a (29,24,22) todos los chunks del radio deben tener solidMesh sin agujeros (faltan ${missingAfterMove})`
          );
          vc.player.x = savedX; vc.player.y = savedY; vc.player.z = savedZ;
        });

        it('Reduce el Pixel Ratio automáticamente si caen los FPS (< 45) y lo restaura a 60 FPS', () => {
          const ws0 = vc.getWorkerState();
          const maxPR = ws0.maxPixelRatio;
          const minPR = ws0.minPixelRatio;

          // Simulate low FPS (30 FPS) -> should step down pixel ratio
          const r1 = vc.updateDynamicResolution(30);
          assert(r1 < maxPR && r1 >= minPR, `A 30 FPS debería reducir el Pixel Ratio por debajo de ${maxPR} (obtuvo ${r1})`);
          assert(Math.abs(vc.renderer.getPixelRatio() - r1) < 1e-3, 'renderer.getPixelRatio() debe reflejar la reducción dinámica');

          // Simulate recovery to 60 FPS -> should restore back to maxPixelRatio

      describe('21. Agricultura Vóxel, Crecimiento Orgánico de Árboles y Pan Horneado', () => {
        it('Hace crecer un Brote de Roble (SAPLING) hasta convertirse en un Árbol 3D completo (WOOD + LEAVES)', () => {
          const tx = 6, ty = 52, tz = 6;
          // Clear space for tree
          for (let dy = 0; dy <= 7; dy++) {
            for (let dz = -2; dz <= 2; dz++) {
              for (let dx = -2; dx <= 2; dx++) {
                vc.setVoxelGlobal(tx + dx, ty + dy, tz + dz, vc.BLOCK.AIR);
              }
            }
          }
          vc.setVoxelGlobal(tx, ty - 1, tz, vc.BLOCK.GRASS);
          vc.setVoxelGlobal(tx, ty, tz, vc.BLOCK.SAPLING);

          // Step voxel simulation (0.18s tick) -> Sapling grows into 3D Oak tree
          vc.updateVoxelSimulation(0.20);
          assert(vc.getVoxelGlobal(tx, ty, tz) === vc.BLOCK.WOOD, 'La base del brote debe convertirse en Tronco de Roble (WOOD)');
          assert(vc.getVoxelGlobal(tx, ty + 2, tz) === vc.BLOCK.WOOD, 'El tronco debe crecer verticalmente');
          assert(vc.getVoxelGlobal(tx, ty + 4, tz) === vc.BLOCK.LEAVES, 'La copa del árbol debe generar Hojas (LEAVES)');

          // Verificar que las caras entre el tronco (WOOD) y las hojas (LEAVES) NO se descartan por culling
          // y que los vértices de hojas en contacto con el tronco quedan anclados (col.r < 0 -> leafWindMask = 0)
          // sin poner nunca textura de hoja encima/debajo de un bloque de madera al romper el tronco hasta las hojas
          const chTree = vc.getChunkData(0, 0);
          const trisWithWoodTrunk = chTree.solidMesh.geometry.index.count / 3;
          vc.setVoxelGlobal(tx, ty + 2, tz, vc.BLOCK.AIR); // Romper madera hasta coincidir con la capa de hojas (ty + 3)
          const posAttr = chTree.solidMesh.geometry.getAttribute('position').array;
          const uvAttr = chTree.solidMesh.geometry.getAttribute('uv').array;
          const colAttr = chTree.solidMesh.geometry.getAttribute('color').array;
          let woodBottomHasLeafTile = false;
          let anchoredLeafVerts = 0;
          for (let v = 0; v < posAttr.length / 3; v++) {
            const vx = posAttr[v * 3], vy = posAttr[v * 3 + 1], vz = posAttr[v * 3 + 2];
            const tileIdx = Math.floor(uvAttr[v * 2] * vc.ATLAS_COLS + 0.0001);
            if (vy === ty + 3 && vx > tx + 0.1 && vx < tx + 0.9 && vz > tz + 0.1 && vz < tz + 0.9 && tileIdx === 7) {
              woodBottomHasLeafTile = true;
            }
            if (
              Math.abs(vx - (tx + 1)) < 0.01 &&
              Math.abs(vy - (ty + 3)) < 0.01 &&
              Math.abs(vz - tz) < 0.01 &&
              tileIdx === 7 &&
              colAttr[v * 3] < 0
            ) {
              anchoredLeafVerts++;
            }
          }
          assert(!woodBottomHasLeafTile, 'El bloque de madera (WOOD) a la altura de las hojas nunca debe tener una capa con textura de hojas (tile 7)');
          assert(anchoredLeafVerts > 0, 'Los vértices de las hojas que tocan la madera deben estar anclados al tronco para no abrir huecos con el viento');
          vc.setVoxelGlobal(tx, ty + 2, tz, vc.BLOCK.WOOD);
          vc.setVoxelGlobal(tx, ty + 3, tz, vc.BLOCK.LEAVES);
          const trisAllLeaves = chTree.solidMesh.geometry.index.count / 3;
          assert(
            trisWithWoodTrunk > trisAllLeaves,
            `Las caras entre WOOD y LEAVES no deben descartarse por culling al mecerse las hojas con el viento (trisWood=${trisWithWoodTrunk}, trisLeaves=${trisAllLeaves})`
          );

          // Verificar caída progresiva de hojas (Leaf Decay) al eliminar solo los bloques de tronco en contacto con las hojas
          vc.setVoxelGlobal(tx, ty + 3, tz, vc.BLOCK.WOOD); // Restaurar el bloque de tronco en contacto con las hojas (ty+3)
          vc.leafDecayQueue.length = 0;
          const countCanopyLeaves = () => {
            let cnt = 0;
            for (let dy = 2; dy <= 6; dy++) {
              for (let dz = -2; dz <= 2; dz++) {
                for (let dx = -2; dx <= 2; dx++) {
                  if (vc.getVoxelGlobal(tx + dx, ty + dy, tz + dz) === vc.BLOCK.LEAVES) cnt++;
                }
              }
            }
            return cnt;
          };
          const leavesInitial = countCanopyLeaves();
          assert(leavesInitial > 20, `El árbol debe tener más de 20 hojas antes de talar el tronco (actual=${leavesInitial})`);
          // Mientras quede el bloque de tronco en contacto con las hojas (ty+3), las hojas no deben desaparecer
          vc.enqueueLeafDecayAround(tx, ty + 3, tz);
          vc.updateVoxelSimulation(0.20);
          assert(countCanopyLeaves() === leavesInitial, 'Mientras quede un bloque de tronco en contacto con las hojas no deben desaparecer');
          // Romper SOLO el bloque de tronco en contacto con las hojas (ty+3), dejando intactos los bloques inferiores del tronco (ty, ty+1, ty+2)
          vc.setVoxelGlobal(tx, ty + 3, tz, vc.BLOCK.AIR);
          assert(vc.getVoxelGlobal(tx, ty, tz) === vc.BLOCK.WOOD && vc.getVoxelGlobal(tx, ty + 1, tz) === vc.BLOCK.WOOD, 'La base del tronco sigue en pie');
          vc.updateVoxelSimulation(0.20);
          const leavesAfterOneTick = countCanopyLeaves();
          assert(
            leavesAfterOneTick > 0 && leavesAfterOneTick < leavesInitial,
            `Al romper solo la madera en contacto con las hojas, estas deben ir desapareciendo aunque quede tronco abajo (inicial=${leavesInitial}, tras 1 tick=${leavesAfterOneTick})`
          );
          // Incluso si el árbol ya estaba sin tronco antes (cola vacía al cargar la partida), el escaneo cercano debe detectarlo y hacer caer sus hojas
          vc.leafDecayQueue.length = 0;
          const origPy = vc.player.y;
          vc.player.y = ty;
          for (let step = 0; step < 35 && countCanopyLeaves() > 0; step++) {
            vc.updateVoxelSimulation(0.20);
          }
          vc.player.y = origPy;
          assert(countCanopyLeaves() === 0, 'Todas las hojas sin tronco en contacto (incluso en árboles ya talados previamente) deben acabar desapareciendo');

          // Clean up tree
          for (let dy = -1; dy <= 7; dy++) {
            for (let dz = -2; dz <= 2; dz++) {
              for (let dx = -2; dx <= 2; dx++) {
                vc.setVoxelGlobal(tx + dx, ty + dy, tz + dz, vc.BLOCK.AIR);
              }
            }
          }
        });

        it('Cultiva Trigo por etapas (WHEAT_1 -> WHEAT_2 -> WHEAT_3) y hornea Pan (+5 corazones)', () => {
          const wx = 10, wy = 52, wz = 6;
          vc.setVoxelGlobal(wx, wy - 1, wz, vc.BLOCK.DIRT);

      describe('34. Esqueleto Arquero Hostil y Bloqueo con Escudo / Espada', () => {
        it('El Esqueleto Arquero dispara flechas 3D al jugador y el Bloqueo con Espada reduce el daño y rebota proyectiles', () => {
          while (vc.mobs.length > 0) vc.removeMobAt(0);

          mobArrow.x = vc.player.x + 0.2;

          for (const a of vc.arrows) a.active = false;
          while (vc.mobs.length > 0) vc.removeMobAt(0);

          const idx = (x, y, z) => (z * 16 + x) * 64 + y;

          // 1) Abeto Boreal ('pine'): tronco alto + copa cónica + punta de nieve (BLOCK.SNOW)

          vc.toggleGameMode('survival');
          vc.player.flying = false;
          vc.armorSlots.fill(0);

          // 1) Con hunger <= 3 no permite esprintar y tampoco regenera vida pasivamente
          vc.player.hunger = 3;
          vc.player.health = 6;

          // 2) Con hunger === 0 sufre 1❤ de daño por inanición tras 4.0s
          vc.player.hunger = 0;
          vc.player.starveTimer = 3.95;
          vc.updatePlayerPhysics(0.1);

          // 3) Comida normal llena Hambre/Saturación (sin curar vida de golpe ni permitir comer con hunger=10), mientras que la Manzana Dorada cura +10❤ directamente incluso con hunger=10

          vc.renderHeartsUI();

          for (let z = -600; z <= 600 && (!foundRiver || !foundRavine); z += 3) {
            for (let x = -600; x <= 600 && (!foundRiver || !foundRavine); x += 3) {
              if (!foundRiver && gen.getRiverFactorAt(x, z) > 0.25) foundRiver = true;
              if (!foundRavine && gen.getRavineFloorAt(x, z) >= 10) foundRavine = true;
            }
          }
          assert(foundRiver, 'El generador debe producir cauces de ríos serpenteantes continuos (getRiverFactorAt > 0.25)');

        it('Construye Minas Abandonadas con raíles (mineshaft), Mazmorras subterráneas (dungeon), Torres de Vigía (watchtower) y Portales en Ruinas (ruined_portal)', () => {

          const surf = new Uint8Array(256).fill(28);

          // 2) Mazmorra Subterránea ('dungeon') en y=12 con cámara de adoquín/ladrillo, Hongos Luminosos, Oro/Diamante y Cofre
          const dDung = new Uint8Array(vc.CHUNK_VOLUME);

          assert(dInfo.type === 'dungeon' && dDung[idx(8, 13, 8)] === vc.BLOCK.CHEST && dDung[idx(7, 13, 7)] === vc.BLOCK.GOLD_ORE && dDung[idx(9, 13, 7)] === vc.BLOCK.DIAMOND_ORE, 'La Mazmorra Subterránea debe contener Cofre, Mena de Oro y Mena de Diamante');

          assert(tInfo.type === 'watchtower' && dTow[idx(8, 29, 8)] === vc.BLOCK.ANVIL && dTow[idx(7, 31, 7)] === vc.BLOCK.LADDER && dTow[idx(9, 29, 7)] === vc.BLOCK.CHEST, 'La Torre de Vigía debe incluir Yunque, Escalera de mano hasta el mirador y Cofre');

          // 4) Portal en Ruinas ('ruined_portal') con suelo de Netherrack, marco de Obsidiana + Bloque de Oro, Lava y Cofre
          const dPort = new Uint8Array(vc.CHUNK_VOLUME);
          const pInfo = gen.placeStructureInChunk(dPort, surf, 5, 5, 'ruined_portal');
          assert(pInfo.type === 'ruined_portal' && dPort[idx(8, 28, 8)] === vc.BLOCK.NETHERRACK && dPort[idx(7, 30, 8)] === vc.BLOCK.OBSIDIAN && dPort[idx(9, 33, 8)] === vc.BLOCK.GOLD_BLOCK && dPort[idx(7, 29, 9)] === vc.BLOCK.CHEST, 'El Portal en Ruinas debe incluir Netherrack, marco de Obsidiana coronado con Oro, Lava y Cofre');

          // 5) Cabañas solitarias extremadamente raras (< 1% de chunks) y Pueblos raros estilo Minecraft ('village')
          let cabinCount = 0, villageCount = 0, totalChecked = 0;
          for (let cz = -20; cz <= 20; cz++) {
            for (let cx = -20; cx <= 20; cx++) {
              totalChecked++;
              if (gen.isCabinChunk(cx, cz)) cabinCount++;
              if (gen.isVillageChunk(cx, cz)) villageCount++;
            }
          }
          assert(cabinCount > 0 && cabinCount / totalChecked < 0.01, `Las cabañas solitarias deben ser extremadamente raras (<1% de chunks, obtuvo ${cabinCount}/${totalChecked})`);
          assert(villageCount >= 4 && villageCount / totalChecked < 0.04, `Los pueblos deben ser raros y agruparse en núcleos de 2×2 chunks (obtuvo ${villageCount}/${totalChecked})`);

          assert(dVil[idx(13, 29, 2)] === vc.BLOCK.FURNACE && dVil[idx(11, 29, 2)] === vc.BLOCK.ANVIL && dVil[idx(12, 29, 4)] === vc.BLOCK.CHEST, 'La Herrería del Pueblo debe incluir Horno, Yunque, Lava y Cofre');
          assert(dVil[idx(12, 28, 12)] === vc.BLOCK.WATER && (dVil[idx(11, 29, 12)] === vc.BLOCK.WHEAT_2 || dVil[idx(11, 29, 12)] === vc.BLOCK.WHEAT_3), 'El Huerto del Pueblo debe tener canal de riego con Agua y cultivos de Trigo');
        });

      describe('47. Optimización de Distancia de Render: LOD Superficial (lodLevel=1), Iluminación Rápida y Horizonte Lejano (farHorizonMesh)', () => {
        it('Reduce drásticamente los vértices con Meshing LOD Superficial (lodLevel=1) e Iluminación Rápida de Superficie (surfaceOnly=true)', () => {
          const testCh = vc.getChunkData(2, 2);
          vc.computeChunkLighting(testCh, (x, z) => vc.chunks.get(`${x},${z}`), true);
          assert(testCh.lightReady === 'surface', `computeChunkLighting(..., true) debe marcar lightReady='surface' sin ejecutar la cola BFS 3D subterránea (obtuvo ${testCh.lightReady})`);
          vc.computeChunkLighting(testCh, (x, z) => vc.chunks.get(`${x},${z}`), false);
          assert(testCh.lightReady === true, 'computeChunkLighting(..., false) debe completar el BFS 3D y marcar lightReady=true');

          const meshFull = vc.buildChunkMeshArrays(2, 2, vc.getVoxelGlobal, vc.getLightGlobal, 1.0, 0);
          const meshLod1 = vc.buildChunkMeshArrays(2, 2, vc.getVoxelGlobal, vc.getLightGlobal, 1.0, 1);
          assert(
            meshLod1.solid.pos.length > 0 && meshLod1.solid.pos.length < meshFull.solid.pos.length * 0.78,
            `El Meshing LOD Superficial (lodLevel=1) debe generar significativamente menos coordenadas de vértices al omitir cuevas subterráneas, flora X-Mesh y caras inferiores (${meshLod1.solid.pos.length} vs ${meshFull.solid.pos.length})`
          );
        });

        it('Genera el Anillo de Horizonte Lejano ("Distant Horizons" farHorizonMesh) de +6 chunks en 1 solo Draw Call y 0 chunks extra en RAM', () => {
          const gen = vc.getGenerator();
          assert(typeof gen.sampleSurfaceAt === 'function', 'El generador debe exponer sampleSurfaceAt(wx, wz) en O(1)');
          const sSample = gen.sampleSurfaceAt(120, -140);
          assert(sSample && sSample.y >= vc.SEA_LEVEL && typeof sSample.color === 'number', 'sampleSurfaceAt debe devolver altura superficial y color hexadecimal del bioma');

          const chunksBefore = vc.chunks.size;
          const rebuilt = vc.updateFarHorizon(true);
          assert(rebuilt === true && vc.farHorizonMesh && vc.farHorizonMesh.geometry, 'updateFarHorizon(true) debe construir la geometría de farHorizonMesh');
          const posAttr = vc.farHorizonMesh.geometry.getAttribute('position');
          const idxAttr = vc.farHorizonMesh.geometry.getIndex();
          assert(posAttr && posAttr.count > 1000 && idxAttr && idxAttr.count > 1500, `farHorizonMesh debe contener la malla fusionada del anillo exterior (>1000 vértices, obtuvo ${posAttr ? posAttr.count : 0})`);
          assert(vc.chunks.size === chunksBefore, `updateFarHorizon NO debe alojar ningún chunk Uint8Array(16384) adicional en RAM (chunks antes=${chunksBefore}, después=${vc.chunks.size})`);

      // =========================================================================
      // SUITE 48: Iluminación y Sombras Dinámicas en GPU estilo Shader-Pack (Dirección Sol/Luna, Sombras de Nubes y Reflejo en Agua)
      // =========================================================================
      describe('48. Iluminación y Sombras Dinámicas en GPU: Dirección Continua Sol/Luna (uLightDir), Sombras Estiradas, Nubes y Reflejo Especular en Agua', () => {
        it('Actualiza continuamente el vector 3D de luz (uLightDir) de Este a Cenit a Oeste y hacia la Luna de noche sin reconstruir chunks', () => {
          const u = vc.gpuShaderUniforms;
          assert(u.uLightDir && u.uCloudDrift, 'gpuShaderUniforms debe exponer uLightDir (Vector3) y uCloudDrift');

          // 1) Amanecer / Mañana (Sol en el Este -> uLightDir.x > 0.65)
          vc.setTimeOfDay(5.1);
          assert(u.uLightDir.value.x > 0.65 && u.uLightDir.value.y > 0.25, `Por la mañana uLightDir debe apuntar hacia el Este (+X > 0.65, obtuvo x=${u.uLightDir.value.x.toFixed(2)}, y=${u.uLightDir.value.y.toFixed(2)})`);

          // 2) Mediodía (Sol en el Cenit con inclinación orbital -> uLightDir.y > 0.85)
          vc.setTimeOfDay(0.0);
          assert(u.uLightDir.value.y > 0.85 && Math.abs(u.uLightDir.value.x) < 0.05, `Al mediodía uLightDir debe caer desde el cenit (y > 0.85, obtuvo y=${u.uLightDir.value.y.toFixed(2)})`);

          // 3) Atardecer (Sol en el Oeste -> uLightDir.x < -0.65)
          vc.setTimeOfDay(1.32);
          assert(u.uLightDir.value.x < -0.65 && u.uLightDir.value.y > 0.15, `Al atardecer uLightDir debe apuntar hacia el Oeste (-X < -0.65, obtuvo x=${u.uLightDir.value.x.toFixed(2)}, y=${u.uLightDir.value.y.toFixed(2)})`);

          // 4) Noche cerrada (Sigue la posición de la Luna)
          vc.setTimeOfDay(Math.PI, 0.75);
          const moonSignX = Math.sign(vc.moonMesh.position.x);
          assert(Math.sign(u.uLightDir.value.x) === moonSignX && Math.abs(u.uLightDir.value.length() - 1.0) < 0.001, 'De noche uLightDir debe estar normalizado y seguir la dirección orbital de la Luna');
          vc.setTimeOfDay(5.82);
        });

        it('Integra en los Fragment Shaders de Bloques y Agua las normales dFdx/dFdy, sombras estiradas (selfShadow), sombras de nubes (cloudShadow) y reflejo especular (spec)', () => {
          const shaders = vc.getShaders();
          assert(shaders.solidShaderRef && shaders.waterShaderRef, 'solidShaderRef y waterShaderRef deben estar compilados');
          const sFrag = shaders.solidShaderRef.fragmentShader;
          const wFrag = shaders.waterShaderRef.fragmentShader;
          assert(sFrag.includes('dFdx(vWorldPos)') && sFrag.includes('uLightDir') && sFrag.includes('selfShadow') && sFrag.includes('cloudShadow'), 'El fragment shader sólido debe calcular normales geométricas (dFdx/dFdy), sombreado direccional (uLightDir), sombras estiradas (selfShadow) y sombras de nubes (cloudShadow)');
          assert(wFrag.includes('uLightDir') && wFrag.includes('halfVec') && wFrag.includes('spec') && wFrag.includes('fresnel'), 'El fragment shader del agua debe calcular reflejo especular Blinn-Phong (spec) y Fresnel hacia el Sol/Luna');
        });
      });

      // SUITE 50: Regresión de 3 Bugs Reportados (Hojas al Caminar, Scroll de 1 Slot y Brazo Único Vacío)
      // =========================================================================
      describe('50. Regresión de Bugs: Hojas Intactas al Caminar, Scroll de 1 Slot y Brazo Único sin Ítem', () => {
        it('No rompe hojas solas al caminar: todas las hojas de los 5 tipos de árbol están conectadas a su tronco (hasNearbyWood)', () => {
          const ch = vc.getChunkData(0, 0);
          const backup = new Uint8Array(ch.data);
          for (const treeType of ['oak', 'pine', 'jungle', 'acacia', 'swamp']) {
            for (let x = 2; x <= 13; x++) {
              for (let z = 2; z <= 13; z++) {
                for (let y = 38; y <= 62; y++) ch.data[(z * 16 + x) * 64 + y] = vc.BLOCK.AIR;
              }
            }
            vc.getGenerator().placeTreeInChunk(ch.data, 8, 42, 8, treeType, 0.5);
            let totalLeaves = 0, disconnectedLeaves = 0;
            for (let x = 2; x <= 13; x++) {
              for (let z = 2; z <= 13; z++) {
                for (let y = 40; y <= 60; y++) {
                  const b = vc.getVoxelGlobal(x, y, z);
                  if (b === vc.BLOCK.LEAVES || b === vc.BLOCK.SNOW_LEAVES) {
                    totalLeaves++;
                    if (!vc.hasNearbyWood(x, y, z)) disconnectedLeaves++;
                  }
                }
              }
            }
            assert(totalLeaves > 10 && disconnectedLeaves === 0, `El árbol '${treeType}' no debe generar hojas desconectadas que se rompan solas al caminar (total=${totalLeaves}, desconectadas=${disconnectedLeaves})`);
          }
          ch.data.set(backup);
        });

        it('Avanza exactamente 1 slot en la barra rápida al hacer scroll (absorbiendo ráfagas de 5 sub-eventos de rueda)', () => {
          const canvasEl = doc.getElementById('game-canvas');
          Object.defineProperty(doc, 'pointerLockElement', { value: canvasEl, configurable: true });
          doc.dispatchEvent(new win.Event('pointerlockchange'));
          vc.updateHotbarSelection(0);
          for (let i = 0; i < 5; i++) {
            win.dispatchEvent(new win.WheelEvent('wheel', { deltaY: 24 }));
          }
          const slotAfterScrollDown = vc.getState().selectedSlot;
          Object.defineProperty(doc, 'pointerLockElement', { value: null, configurable: true });
          doc.dispatchEvent(new win.Event('pointerlockchange'));
          assert(slotAfterScrollDown === 1, `Un giro de rueda (ráfaga de 5 eventos wheel) debe avanzar solo 1 slot (0 -> 1), pero avanzó a ${slotAfterScrollDown}`);
        });

        it('Muestra un único brazo 3D (handArmMesh) y oculta handMesh cuando se selecciona un slot vacío sin ítem', () => {
          vc.updateHotbarSelection(-1);
          assert(vc.handArmMesh.visible === true && vc.handMesh.visible === false, `Al seleccionar un slot sin ítem (BLOCK.AIR), handMesh.visible debe ser false para no duplicar el brazo (handArmMesh.visible=${vc.handArmMesh.visible}, handMesh.visible=${vc.handMesh.visible})`);
          vc.hotbarSlots[0] = vc.BLOCK.TOOL_PICKAXE;
          vc.updateHotbarSelection(0);
          assert(vc.handArmMesh.visible === true && vc.handMesh.visible === true, 'Al equipar un ítem deben ser visibles tanto handMesh (icono) como handArmMesh (brazo)');
        });
      });

      // =========================================================================
      // SUITE 51: Selector de Sistema de Iluminación (Ultra PC Shadow Map vs Ligero Móvil Shader)
      // =========================================================================
      describe('51. Selector de Iluminación: Shadow Map 3D Real (Por defecto en PC) vs Shader Dinámico (Por defecto en Móvil)', () => {
        it('Detecta por defecto el modo más exigente (shadowmap) en PC y el menos exigente (shader) en Móvil/Tablet', () => {
          assert(vc.detectDefaultLightingMode(false) === 'shadowmap', `En PC (isMobile=false) debe usar por defecto 'shadowmap' (obtenido: ${vc.detectDefaultLightingMode(false)})`);
          assert(vc.detectDefaultLightingMode(true) === 'shader', `En Móvil/Tablet (isMobile=true) debe usar por defecto 'shader' (obtenido: ${vc.detectDefaultLightingMode(true)})`);
        });

        it('Permite elegir el sistema de iluminación desde el menú (#lighting-select) y alterna la pasada de Shadow Map 3D real', () => {
          const selectEl = doc.getElementById('lighting-select');
          const lblEl = doc.getElementById('lbl-lighting');
          assert(selectEl && lblEl, 'Deben existir #lighting-select y #lbl-lighting en el menú de configuración');

          vc.setTimeOfDay(4.2);
          vc.setLightingMode('shader');
          assert(vc.getLightingMode() === 'shader', 'getLightingMode() debe devolver shader');
          assert(vc.gpuShaderUniforms.uUseShadowMap.value === 0.0, 'En modo shader, uUseShadowMap debe ser 0.0');
          assert(lblEl.textContent.includes('Ligero'), `La etiqueta del menú debe reflejar modo Ligero (${lblEl.textContent})`);
          assert(vc.updateShadowMapPass(true) === false, 'En modo shader, updateShadowMapPass() no debe ejecutar la pasada extra de sombras');

          selectEl.value = 'shadowmap';
          selectEl.dispatchEvent(new win.Event('change'));
          assert(vc.getLightingMode() === 'shadowmap', 'Cambiar #lighting-select a shadowmap debe activar el modo Ultra PC');
          assert(vc.gpuShaderUniforms.uUseShadowMap.value === 1.0, 'En modo shadowmap, uUseShadowMap debe ser 1.0');
          assert(lblEl.textContent.includes('Ultra'), `La etiqueta del menú debe reflejar modo Ultra (${lblEl.textContent})`);

          const prevPasses = vc.getShadowPassCount();
          const rendered = vc.updateShadowMapPass(true);
          assert(rendered === true && vc.getShadowPassCount() === prevPasses + 1, 'En modo shadowmap, updateShadowMapPass(true) debe renderizar el mapa de profundidad solar en shadowMapTarget');
          vc.setTimeOfDay(5.82);
        });

        it('Genera grietas de rotura pixel-art 100% acumulativas en 8 fases sin saltar de ángulo entre etapas', () => {
          assert(vc.crackTextures && vc.crackTextures.length === 8, 'Deben existir 8 texturas de grietas progresivas');
          let prevCount = 0, prevMask = null;
          for (let s = 0; s < 8; s++) {
            const cv = vc.crackTextures[s].image;
            const data = cv.getContext('2d').getImageData(0, 0, 16, 16).data;
            let count = 0;
            const mask = new Uint8Array(256);
            for (let p = 0; p < 256; p++) {
              if (data[p * 4 + 3] > 0) {
                count++;
                mask[p] = 1;
              }
              if (prevMask && prevMask[p] === 1) {
                assert(mask[p] === 1, `La fase de grieta ${s} debe conservar todos los píxeles de la fase ${s - 1} sin cambiar de ángulo`);
              }
            }
            assert(count > prevCount, `La fase ${s} debe añadir nuevos píxeles de fisura acumulativos (${count} > ${prevCount})`);
            prevCount = count;
            prevMask = mask;
          }
        });
      });

      // Execute all suites
      for (const suite of suites) {
        currentSuite = suite;
        suite.fn();

        const card = document.createElement('div');
        card.className = 'suite-card';
        card.innerHTML = `<div class="suite-title">${suite.suiteName}</div>`;

        for (const t of suite.tests) {
          const row = document.createElement('div');
          try {
            await t.testFn();
            totalPassed++;
            row.className = 'test-row pass';
            row.innerHTML = `<span>${t.testName}</span><span class="status">✓ PASS</span>`;
          } catch (err) {
            totalFailed++;
            failures.push({ suite: suite.suiteName, test: t.testName, error: err.message });
            row.className = 'test-row fail';
            row.innerHTML = `<span>${t.testName}<br><small style="color:#fca5a5">${err.message}</small></span><span class="status">✗ FAIL</span>`;
          }
          card.appendChild(row);
        }
        suitesContainer.appendChild(card);
      }

      if (totalFailed === 0) {
        summaryBanner.className = 'pass';
        summaryBanner.textContent = `✓ TODOS LOS TESTS PASARON (${totalPassed}/${totalPassed} exitosos, 0 fallos)`;
      } else {
        summaryBanner.className = 'fail';
        summaryBanner.textContent = `✗ FALLARON ${totalFailed} TESTS (${totalPassed} exitosos, ${totalFailed} fallos)`;
      }

      // Run per-feature FPS cost profiler on reference machine
      const gl = vc.renderer.getContext();
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      const gpuName = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);

      const bench = (fn, iters = 300) => {
        for (let i = 0; i < 15; i++) fn();
        const t0 = performance.now();
        for (let i = 0; i < iters; i++) fn();
        return (performance.now() - t0) / iters;
      };

      // Ensure 6 mobs and 8 active 3D item drops exist for realistic per-frame benchmark
      while (vc.mobs.length < 6) {
        vc.spawnMob(vc.mobs.length % 2 === 0 ? 'sheep' : 'zombie', vc.player.x + 3, vc.player.y + 2, vc.player.z + 3);
      }
      for (let i = 0; i < 8; i++) {
        vc.spawnItemDrop(vc.player.x + 6, vc.player.y + 2, vc.player.z + 6, vc.BLOCK.COBBLE, 1, 5.0);
      }
      vc.toggleWeather('rain');
      vc.shootArrow(vc.player.x, vc.player.y + 1.5, vc.player.z, 0, 0.2, -1);
      vc.setVoxelGlobal(10, 52, 10, vc.BLOCK.RAIL);
      vc.setVoxelGlobal(11, 52, 10, vc.BLOCK.RAIL);
      const benchCart = vc.spawnMinecart(10, 52, 10);
      benchCart.speed = 11.5;
      const benchBoat = vc.spawnBoat(12, 52, 12);
      benchBoat.vx = 9.5;

      const perFrameFeatures = [
        { name: 'Render WebGL + Shaders GPU (Viento/Olas/Lava)',    ms: bench(() => { vc.renderer.render(vc.scene, vc.camera); }, 120) },
        { name: 'Criaturas (Mobs: IA, Físicas AABB y Animación)',   ms: bench(() => { vc.updateMobs(0.016); }, 400) },
        { name: 'Drops 3D Flotantes e Imantados (InstancedMesh)',   ms: bench(() => { vc.updateItemDrops(0.016); }, 500) },
        { name: 'Clima Dinámico: Lluvia/Nieve/Tormentas (1 Draw)',  ms: bench(() => { vc.updateWeather(0.016); }, 500) },
        { name: 'Smart Frustum Culling 3D (Box3 vs Camera)',        ms: bench(() => { vc.updateFrustumCulling(); }, 500) },
        { name: 'Minimapa Radar 2D + Balizas GPS (Amortizado 10 Hz)',ms: bench(() => { vc.updateMinimap(0.016, false); }, 500) },
        { name: 'Vagonetas 3D y Físicas de Vías (BLOCK.RAIL)',       ms: bench(() => { vc.updateMinecarts(0.016); }, 500) },
        { name: 'Barcas Navegables 3D (Sailing Boats)',              ms: bench(() => { vc.updateBoats(0.016); }, 500) },
        { name: 'Flechas Balísticas 3D (Arco InstancedMesh)',       ms: bench(() => { vc.updateArrows(0.016); }, 500) },
        { name: 'Físicas del Jugador + Avatar 3ªP + Slime Bounce',  ms: bench(() => { vc.updatePlayerPhysics(0.016); }, 500) },
        { name: 'Pool Partículas InstancedMesh (120 instancias)',   ms: bench(() => { vc.updateParticles(0.016); }, 500) },
        { name: 'Raycast Vóxel 3D (DDA)',                           ms: bench(() => { vc.raycastVoxel(vc.camera.position.x, vc.camera.position.y, vc.camera.position.z, 0, -0.3, -0.95, 6.5); }, 600) },
        { name: 'Cielo Dinámico (Sol, Luna, Estrellas, Nubes 3D)',  ms: bench(() => { vc.updateDynamicSky(0.016); }, 600) },
        { name: 'Uniforms GPU + Atmósfera Subacuática (CPU)',       ms: bench(() => { vc.updateGPUShaders(0.016); }, 600) },
        { name: 'Música C418 FM + Paisaje Sonoro (Web Audio API)',  ms: bench(() => { vc.updateAmbientAudio(0.016); }, 600) },
        { name: 'Cola de Simulación Vóxel (Cultivos/Agua/Lava/TNT)',ms: bench(() => { vc.updateVoxelSimulation(0.001); }, 600) }
      ];

      while (vc.mobs.length > 0) vc.removeMobAt(0);
      while (vc.minecarts.length > 0) {
        const c = vc.minecarts.pop();
        vc.scene.remove(c.root);
      }
      vc.setVoxelGlobal(10, 52, 10, vc.BLOCK.AIR);
      vc.setVoxelGlobal(11, 52, 10, vc.BLOCK.AIR);
      while (vc.boats.length > 0) { const b = vc.boats.pop(); vc.scene.remove(b.root); }
      for (const d of vc.itemDrops) d.active = false;
      for (const a of vc.arrows) a.active = false;
      vc.toggleWeather('clear');

      const ch0 = vc.getChunkData(0, 0);
      const sampleMesh0 = vc.buildChunkMeshArrays(0, 0, vc.getVoxelGlobal, vc.getLightGlobal, 1.0);
      const onDemandFeatures = [
        { name: 'Generación Chunk (Terreno + Cuevas 3D 4×4×4 + Menas)', ms: bench(() => { vc.getGenerator().generateChunkVoxels(50, 50, null); }, 40) },
        { name: 'Iluminación Vóxel Flood-Fill BFS (16,384 bloques)',    ms: bench(() => { vc.computeChunkLighting(ch0, (x, z) => vc.chunks.get(`${x},${z}`), false); }, 40) },
        { name: 'Iluminación Rápida Superficial LOD (surfaceOnly=true)',ms: bench(() => { vc.computeChunkLighting(ch0, (x, z) => vc.chunks.get(`${x},${z}`), true); }, 60) },
        { name: 'Meshing Chunk Síncrono Completo (lodLevel=0)',         ms: bench(() => { vc.buildChunkMeshArrays(0, 0, vc.getVoxelGlobal, vc.getLightGlobal, 1.0, 0); }, 30) },
        { name: 'Meshing Chunk LOD Superficial Lejano (lodLevel=1)',    ms: bench(() => { vc.buildChunkMeshArrays(0, 0, vc.getVoxelGlobal, vc.getLightGlobal, 1.0, 1); }, 50) },
        { name: 'Meshing vía Web Worker (Coste en Hilo Principal)',     ms: bench(() => { vc.packChunkPaddedBuffers(0, 0); vc.applyArraysToMesh(ch0, sampleMesh0); }, 40) },
        { name: 'Anillo Horizonte Lejano (+6 Chunks en 1 Draw Call)',   ms: bench(() => { vc.updateFarHorizon(true); }, 15) },
        { name: 'Pasada Shadow Map 3D Real 1024×1024 (Modo Ultra PC)',  ms: bench(() => { vc.setLightingMode('shadowmap'); vc.updateShadowMapPass(true); }, 25) },
        { name: 'Pistón Mecánico Redstone (Empuje de Bloques en Lote)', ms: bench(() => { ch0.data[(14 * 16 + 14) * 64 + 53] = vc.BLOCK.PISTON; ch0.data[(14 * 16 + 14) * 64 + 54] = vc.BLOCK.STONE; ch0.data[(14 * 16 + 14) * 64 + 55] = vc.BLOCK.AIR; vc.triggerVoxelPiston(14, 53, 14, 13, 53, 14, new Set()); }, 60) }
      ];

      const totalFrameMs = perFrameFeatures.reduce((acc, f) => acc + f.ms, 0);
      const totalFpsCost60 = (totalFrameMs / 16.667) * 60;
      const theoreticalUncappedFps = Math.round(1000 / Math.max(0.01, totalFrameMs));

      const benchContainer = document.getElementById('benchmark-container');
      benchContainer.innerHTML = `
        <div class="suite-card" style="border-color:#38bdf8;">
          <div class="suite-title" style="color:#38bdf8;display:flex;justify-content:space-between;align-items:center;">
            <span>📊 Coste en FPS por Funcionalidad (PC de Referencia)</span>
            <span class="bench-badge">60 FPS estables (Usa ${totalFpsCost60.toFixed(2)} / 60 FPS · ~${theoreticalUncappedFps} FPS sin VSync)</span>
          </div>
          <div style="font-size:11.5px;color:var(--muted);margin-bottom:6px;">
            Hardware: <b>${navigator.hardwareConcurrency || '?'} hilos CPU</b> · GPU: <b>${gpuName}</b> · Presupuesto 60 FPS = <b>16.67 ms/frame</b>
          </div>
          <table class="bench-table">
            <thead>
              <tr>
                <th>Funcionalidad (Por Frame a 60 Hz)</th>
                <th style="text-align:right">Tiempo</th>
                <th style="text-align:right">Coste sobre 60 FPS</th>
                <th style="text-align:right">% Presupuesto (16.67ms)</th>
              </tr>
            </thead>
            <tbody>
              ${perFrameFeatures.map(f => {
                const fps60 = (f.ms / 16.667) * 60;
                const pct = (f.ms / 16.667) * 100;
                const timeStr = f.ms < 0.01 ? `${(f.ms * 1000).toFixed(2)} µs` : `${f.ms.toFixed(3)} ms`;
                return `<tr>
                  <td>${f.name}</td>
                  <td class="num">${timeStr}</td>
                  <td class="num">-${fps60.toFixed(3)} FPS</td>
                  <td class="num">${pct.toFixed(2)}%</td>
                </tr>`;
              }).join('')}
              <tr style="font-weight:700;color:#4ade80;">
                <td>TOTAL POR FRAME (Margen libre: ${(60 - totalFpsCost60).toFixed(2)} / 60 FPS)</td>
                <td class="num">${totalFrameMs.toFixed(3)} ms</td>
                <td class="num">-${totalFpsCost60.toFixed(2)} FPS (de 60)</td>
                <td class="num">${((totalFrameMs / 16.667) * 100).toFixed(2)}%</td>
              </tr>
            </tbody>
          </table>
          <table class="bench-table" style="margin-top:10px;">
            <thead>
              <tr>
                <th>Operaciones Puntuales (Bajo Demanda / Streaming por Chunk)</th>
                <th style="text-align:right">Tiempo Medio</th>
                <th style="text-align:right">% de 1 Frame (16.67ms)</th>
              </tr>
            </thead>
            <tbody>
              ${onDemandFeatures.map(f => `<tr>
                <td>${f.name}</td>
                <td class="num">${f.ms.toFixed(2)} ms</td>
                <td class="num">${((f.ms / 16.667) * 100).toFixed(1)}%</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      `;

      window.__TEST_RESULTS__ = {
        done: true,
        passed: totalPassed,
        failed: totalFailed,
        failures,
        benchmarks: {
          gpuName,
          cores: navigator.hardwareConcurrency,
          totalFrameMs,
          totalFpsCost60,
          theoreticalUncappedFps,
          perFrameFeatures,
          onDemandFeatures
        }
      };
    }

    gameFrame.addEventListener('load', () => {
      setTimeout(runAllTests, 250);
    });

    document.getElementById('btn-rerun').addEventListener('click', () => {
      window.__TEST_RESULTS__ = null;
      gameFrame.contentWindow.location.reload();
    });
  </script>
</body>
</html>
